[platformio]
src_dir = .

[env:teensy41]
platform = https://github.com/tsandmann/platform-teensy.git
board = teensy41
framework = arduino
lib_deps =
    https://github.com/tsandmann/freertos-teensy.git
build_src_filter =
    +<src/>
    +<app/>
    +<platform/teensy41/>
build_flags =
    -I .
    -Wformat=1
    -DUSB_SERIAL
    -DTEENSY_OPT_FASTER_LTO
upload_flags = -v
monitor_speed = 115200
upload_protocol = teensy-cli
